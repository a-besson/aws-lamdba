name: build-springboot-lambda-api-gateway-rest

on:
  pull_request:
    paths:
      - "springboot-lambda-api-gateway-rest/**"
      - "pom.xml"
      - "checkstyle.xml"
      - ".tflint.hcl"
      - ".github/workflows/_build-java.yml"
      - ".github/workflows/build-springboot-lambda-api-gateway-rest.yml"

concurrency:
  group: build-springboot-lambda-api-gateway-rest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-java.yml
    with:
      module: springboot-lambda-api-gateway-rest
      native: false
